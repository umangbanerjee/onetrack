<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Compass / Tracker Logo Icon -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Circular Track -->
    <circle cx="150" cy="150" r="130" fill="none" stroke="url(#glowGrad)" stroke-width="16" stroke-dasharray="8 8"/>
    <circle cx="150" cy="150" r="95" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
    
    <!-- Central Pointer / Crosshair -->
    <polygon points="150,45 185,135 150,115 115,135" fill="#ffffff"/>
    <polygon points="150,255 185,165 150,185 115,165" fill="rgba(255,255,255,0.6)"/>
    <polygon points="255,150 165,185 185,150 165,115" fill="rgba(255,255,255,0.8)"/>
    <polygon points="45,150 135,185 115,150 135,115" fill="rgba(255,255,255,0.5)"/>
    
    <!-- Center Glowing Pivot -->
    <circle cx="150" cy="150" r="22" fill="#ffffff"/>
    <circle cx="150" cy="150" r="10" fill="#2563eb"/>
    <circle cx="215" cy="85" r="8" fill="#10b981"/>
  </g>
</svg>
